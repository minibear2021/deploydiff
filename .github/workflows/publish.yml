name: Build And Publish Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version-change:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
      package_version: ${{ steps.current.outputs.package_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read current package version
        id: current
        run: echo "package_version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Detect package version change
        id: detect
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_PACKAGE_JSON=$(git show "${{ github.event.before }}:package.json" 2>/dev/null || true)
          if [ -z "$PREVIOUS_PACKAGE_JSON" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(printf '%s' "$PREVIOUS_PACKAGE_JSON" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Lint source
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate changelog entry for current version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION="$VERSION" node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = changelog.split(/\r?\n/);
          const heading = `## ${version}`;
          const start = lines.findIndex((line) => line.trim() === heading);

          if (start === -1) {
            console.error(`Missing changelog section: ${heading}`);
            process.exit(1);
          }

          let end = lines.length;
          for (let index = start + 1; index < lines.length; index += 1) {
            if (lines[index].startsWith('## ')) {
              end = index;
              break;
            }
          }

          const body = lines.slice(start + 1, end).join('\n').trim();
          if (!body) {
            console.error(`Changelog section ${heading} is empty`);
            process.exit(1);
          }
          EOF

      - name: Package VSIX
        run: npx @vscode/vsce package --out deploydiff-${{ github.sha }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploydiff-vsix-${{ github.sha }}
          path: deploydiff-*.vsix

  publish-marketplace:
    needs:
      - detect-version-change
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package version still matches detection result
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ needs.detect-version-change.outputs.package_version }}" ]; then
            echo "Detected package version ${{ needs.detect-version-change.outputs.package_version }} but current package.json is $PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"

  create-github-release:
    needs:
      - detect-version-change
      - verify
      - publish-marketplace
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: deploydiff-vsix-${{ github.sha }}
          path: release-assets

      - name: Extract release notes from changelog
        run: |
          VERSION="${{ needs.detect-version-change.outputs.package_version }}"
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = changelog.split(/\r?\n/);
          const heading = `## ${version}`;
          const start = lines.findIndex((line) => line.trim() === heading);

          if (start === -1) {
            console.error(`Could not find changelog section for ${heading}`);
            process.exit(1);
          }

          let end = lines.length;
          for (let index = start + 1; index < lines.length; index += 1) {
            if (lines[index].startsWith('## ')) {
              end = index;
              break;
            }
          }

          const body = lines.slice(start + 1, end).join('\n').trim();
          if (!body) {
            console.error(`Changelog section ${heading} is empty`);
            process.exit(1);
          }

          fs.writeFileSync('release-notes.md', body + '\n');
          EOF
        env:
          VERSION: ${{ needs.detect-version-change.outputs.package_version }}

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.package_version }}
          name: DeployDiff v${{ needs.detect-version-change.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          overwrite_files: true
          files: release-assets/*.vsix